name: Deploy to Production (System Solkit)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via Native SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Add host key to known_hosts
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Execute automated deployment on VPS
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "🚀 Starting automated deployment for system.solkit.tech..."
            cd /var/www/system.solkit.tech

            echo "📥 Fetching latest code from main branch..."
            git fetch origin main
            git reset --hard HEAD
            git checkout -B main origin/main --force
            git reset --hard origin/main

            echo "📦 Installing composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            echo "⚡ Building frontend assets..."
            npm ci || npm install
            npm run build

            echo "🧹 Refreshing and optimizing caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "🔒 Ensuring correct permissions..."
            chown -R www-data:www-data /var/www/system.solkit.tech/storage /var/www/system.solkit.tech/bootstrap/cache
            chmod -R 775 /var/www/system.solkit.tech/storage /var/www/system.solkit.tech/bootstrap/cache

            echo "🔄 Reloading PHP-FPM..."
            systemctl reload php8.5-fpm

            echo "✅ Deployment completed successfully for system.solkit.tech!"
          EOF
